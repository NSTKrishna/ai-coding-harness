[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Autonomous software-engineering harness around a text-only foundation model."
readme = "README.md"
requires-python = ">=3.10"
# Standard library only. Add runtime dependencies here if they become necessary.
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
